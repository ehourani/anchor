name: CI

# Every push (main and work branches) and every PR: typecheck, test, build.
# Tests never reach Supabase (see src/test/setup.ts), so no secrets are needed.
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee npm-ci.log
      # Surface npm's error lines as annotations, readable without log access.
      - name: Report install errors
        if: failure()
        shell: bash
        run: grep -iE "npm (err|error)" npm-ci.log | head -40 | sed 's/^/::error::/' || true
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
